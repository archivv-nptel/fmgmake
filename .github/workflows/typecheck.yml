name: Typecheck
on:
  workflow_call:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Bound parallel workspace builds on standard GitHub-hosted runners.
env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/dangerous-git-checkout

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Setup Node.js (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      # The lockfile contains native addons using node-gyp 8, which requires distutils.
      - name: Setup Python for native dependency builds
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.platform=linux --config.architecture=x64

      # apps/web's typegen and @formbricks/database's build (both in the
      # typecheck task graph) read variables from the root .env.
      - name: Create .env
        run: pnpm dev:setup

      - name: Typecheck
        run: pnpm typecheck --concurrency=1 --env-mode=loose
